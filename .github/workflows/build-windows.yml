# Gera o executável Windows da interface de rastreamento (src/tracker.py).
# O PyInstaller não compila para outro sistema, por isso o build roda num
# runner Windows. O .exe fica disponível como artefato da execução.
name: Executável Windows

on:
  push:
    branches: [main, ci/build-executavel-windows]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements-tracker.txt"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements-tracker.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tracker.txt

      - name: Instala as dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tracker.txt pyinstaller

      - name: Roda os testes
        run: python -m unittest discover -s tests -v

      - name: Gera o executável
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name RastreadorBalao
          --paths src
          --collect-all tkintermapview
          src/tracker.py

      # O .exe é --windowed: um erro na inicialização não derruba o processo,
      # só abre o diálogo "Unhandled exception". Por isso o teste espera a
      # janela principal pelo título, em vez de checar se o processo vive.
      - name: Testa se o executável abre a janela principal
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\RastreadorBalao.exe" -PassThru
          $janela = $null
          for ($i = 0; $i -lt 60 -and -not $janela; $i++) {
            Start-Sleep -Seconds 1
            $janelas = Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object -ExpandProperty MainWindowTitle
            $janela = $janelas | Where-Object { $_ -like "*Monitor de Miss*" }
            $erro = $janelas | Where-Object { $_ -like "*Unhandled exception*" }
            if ($erro) { break }
          }
          taskkill /PID $p.Id /T /F 2>$null | Out-Null
          if (-not $janela) {
            Write-Host "Janelas abertas: $($janelas -join ' | ')"
            Write-Error "A janela principal não abriu em 60 s."
            exit 1
          }
          Write-Host "Janela aberta: $janela"
          Get-Item "dist\RastreadorBalao.exe" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: RastreadorBalao-windows
          path: dist/RastreadorBalao.exe
          retention-days: 30
